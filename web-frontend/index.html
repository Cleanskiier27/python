<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Frontend Starter</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f4f6; }
    .card { padding: 2rem; border-radius: 16px; background: white; box-shadow: 0 16px 32px rgba(0,0,0,0.08); text-align: center; }
    button { padding: 0.75rem 1.5rem; border: none; border-radius: 999px; background: #2563eb; color: white; cursor: pointer; font-size: 1rem; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Web Frontend Starter</h1>
    <p>Click the button to see a browser message.</p>
    <button id="action">Say Hello</button>
    <p id="output"></p>
  </div>

  <script>
    document.getElementById('action')?.addEventListener('click', () => {
      document.getElementById('output')!.textContent = 'Hello from the Web frontend!';
    });
  </script>
</body>
</html>
